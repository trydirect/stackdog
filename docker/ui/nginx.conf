server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Regenerated on every container start, so it must never be cached.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
