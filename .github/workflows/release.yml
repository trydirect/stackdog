name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # musl targets link statically, so the builder image sets no
          # glibc floor the way a gnu target would: the binary runs on any
          # Linux. cross compiles inside its own containers.
          - target: x86_64-unknown-linux-musl
            artifact: stackdog-linux-x86_64
            runner: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            artifact: stackdog-linux-aarch64
            runner: ubuntu-latest
            cross: true
          - target: aarch64-apple-darwin
            artifact: stackdog-macos-aarch64
            runner: macos-latest
            cross: false
          - target: x86_64-apple-darwin
            artifact: stackdog-macos-x86_64
            runner: macos-latest
            cross: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary (cross)
        if: matrix.cross
        env:
          CARGO_TARGET_DIR: target-cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build release binary
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then SRC=target-cross; else SRC=target; fi
          mkdir -p dist
          cp $SRC/${{ matrix.target }}/release/stackdog dist/stackdog
          cd dist
          tar czf ${{ matrix.artifact }}.tar.gz stackdog
          shasum -a 256 ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.tar.gz
            dist/${{ matrix.artifact }}.tar.gz.sha256

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.sha256
